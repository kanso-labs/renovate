name: Renovate

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        default: disabled
        description: Log what would change instead of writing branches and PRs
        options:
          - disabled
          - extract
          - lookup
          - full
        required: false
        type: choice
      logLevel:
        default: info
        description: Override default log level
        options:
          - debug
          - info
          - warn
          - error
        required: false
        type: choice
      # For a caller that wants one repository's run rather than all of them,
      # such as a comment command answering `@renovate rebase` on one pull
      # request. Left empty, as on the schedule and on the Run workflow button,
      # the run covers everything.
      repository:
        default: ""
        description:
          Run on this one repository instead of all of them, such as
          kanso-labs/daily-core. It must be listed in config.js.
        required: false
        type: string

# Renovate acts through the application token minted in the job below, so the
# workflow's own GITHUB_TOKEN only needs to read this repository's
# configuration.
permissions:
  contents: read

# A manual run must never overlap the schedule: two instances would race each
# other on the same branches in the managed repositories. That holds for a run
# narrowed to one repository too, since the scheduled run reaches the same
# branches, so there is one group for every kind of run rather than one per
# repository.
#
# The cost is GitHub's: a group holds one running and one pending run, and a
# newer pending run cancels the older one. A run narrowed to one repository
# arriving while a scheduled run waits therefore replaces it, and the full run
# happens at the next schedule instead; two narrowed runs arriving together
# leave only the later one. Nothing is lost for good, because the next
# scheduled run covers every repository, and a ticked rebase checkbox stays
# ticked until a run reads it.
concurrency:
  cancel-in-progress: false
  group: renovate

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Anyone who can dispatch this workflow can type anything into the
      # repository input, and the application token below writes to every
      # repository the installation covers, which is more than config.js lists.
      # So a name is accepted only if it is shaped like owner/name and equals
      # an entry of the repositories list, character for character and case
      # included, and anything else stops the run before a token exists. The
      # shape check comes first because a string input can hold a newline:
      # grep would read each line as a pattern of its own and pass on any one,
      # and the rest would land in GITHUB_OUTPUT as a second value. The list is
      # read with sed rather than by loading config.js, so the check needs
      # nothing the runner might not have; a list it cannot parse comes back
      # empty and fails closed. It is the list on the ref being run, which is
      # main unless the dispatch names another.
      #
      # The value arrives through env, never interpolated into the script,
      # because a ${{ }} expression is pasted in before the shell parses it.
      - name: Check the requested repository
        id: scope
        env:
          REQUESTED: ${{ inputs.repository }}
        run: |
          set -euo pipefail

          if [[ -z "${REQUESTED}" ]]; then
            echo "No repository requested, so this run covers every repository in config.js."
            exit 0
          fi

          if [[ ! "${REQUESTED}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::The repository input has to look like owner/name, such as kanso-labs/daily-core."
            exit 1
          fi

          listed=$(sed -n "/^  repositories: \[/,/^  \],/s/^    '\([^']*\)',\$/\1/p" config.js)
          if [[ -z "${listed}" ]]; then
            echo "::error::Could not read the repositories list in config.js, so \"${REQUESTED}\" cannot be checked against it."
            exit 1
          fi

          found=false
          while IFS= read -r name; do
            if [[ "${name}" == "${REQUESTED}" ]]; then
              found=true
            fi
          done <<<"${listed}"

          if [[ "${found}" != true ]]; then
            echo "::error::\"${REQUESTED}\" is not in the repositories list in config.js, so Renovate will not run on it. Listed: $(paste -sd ' ' <<<"${listed}")"
            exit 1
          fi

          echo "repository=${REQUESTED}" >>"${GITHUB_OUTPUT}"
          echo "Running on ${REQUESTED} alone."

      # Minted per run, expires in an hour and is revoked when the job ends, so
      # no credential with write access to every managed repository sits in a
      # secret waiting to be stolen or to lapse unnoticed.
      #
      # `owner` with no `repositories` scopes the token to everything the
      # installation covers, which is what the repositories list in config.js
      # expects. Left at its default the token would reach this repository
      # alone, and every other managed repository would come back 404.
      - name: Mint an application token
        id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ secrets.RENOVATE_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}

      # The token above dies an hour after the step that minted it, a moment
      # later than the job timeout above. A run long enough to outlive its
      # credential is killed by the timeout first, so the failure is always the
      # legible one rather than a wall of 401s partway through.
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.15
        with:
          configurationFile: config.js
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          # Resolves to an empty string both on a schedule (no inputs at all)
          # and when dispatched with dryRun left at "disabled". Renovate skips
          # empty environment variables, which is what makes that a real run.
          RENOVATE_DRY_RUN: ${{ inputs.dryRun != 'disabled' && inputs.dryRun || '' }}
          # The classic personal access token config.js reads GitHub Packages
          # with. The action hands Renovate's container only variables that
          # start RENOVATE_, and Renovate reads one whose next word is
          # GITHUB or a datasource, such as NPM, as a host rule of its own,
          # which is why the name says neither. The secret's own name starts
          # GH_ because GitHub refuses one that starts GITHUB_. Unset, it
          # resolves to an empty string and config.js adds no rule.
          RENOVATE_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          # Replaces the repositories list in config.js with the one repository
          # the step above accepted, the way the dry run in validate.yaml
          # narrows itself to this repository. Taken from that step's output
          # rather than from the input, so only a checked name can reach it.
          # Empty when no repository was requested, and Renovate skips empty
          # environment variables, so config.js's list stands.
          RENOVATE_REPOSITORIES: ${{ steps.scope.outputs.repository }}
