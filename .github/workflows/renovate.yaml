name: Renovate

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        default: disabled
        description: Log what would change instead of writing branches and PRs
        options:
          - disabled
          - extract
          - lookup
          - full
        required: false
        type: choice
      logLevel:
        default: info
        description: Override default log level
        options:
          - debug
          - info
          - warn
          - error
        required: false
        type: choice

# Renovate acts through the application token minted in the job below, so the
# workflow's own GITHUB_TOKEN only needs to read this repository's
# configuration.
permissions:
  contents: read

# A manual run must never overlap the schedule: two instances would race each
# other on the same branches in the managed repositories.
concurrency:
  cancel-in-progress: false
  group: renovate

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Minted per run, expires in an hour and is revoked when the job ends, so
      # no credential with write access to every managed repository sits in a
      # secret waiting to be stolen or to lapse unnoticed.
      #
      # `owner` with no `repositories` scopes the token to everything the
      # installation covers, which is what the repositories list in config.js
      # expects. Left at its default the token would reach this repository
      # alone, and every other managed repository would come back 404.
      - name: Mint an application token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.RENOVATE_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      # The token above dies an hour after the step that minted it, a moment
      # later than the job timeout above. A run long enough to outlive its
      # credential is killed by the timeout first, so the failure is always the
      # legible one rather than a wall of 401s partway through.
      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.4
        with:
          configurationFile: config.js
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          # Resolves to an empty string both on a schedule (no inputs at all)
          # and when dispatched with dryRun left at "disabled". Renovate skips
          # empty environment variables, which is what makes that a real run.
          RENOVATE_DRY_RUN: ${{ inputs.dryRun != 'disabled' && inputs.dryRun || '' }}
