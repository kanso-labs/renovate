name: Validate

# A broken config file here stops dependency updates across every managed
# repository, and the failure is silent, so validate it before it reaches main.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: validate-${{ github.ref }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=github-releases depName=rhysd/actionlint
      ACTIONLINT_VERSION: 1.7.12
      # renovate: datasource=npm depName=renovate
      VALIDATOR_VERSION: 44.32.2
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      # No file arguments: the validator then discovers config.js and
      # renovate.json itself and checks each against the right schema (global
      # vs. repository). Passing explicit paths would validate both as global.
      - name: Validate Renovate configuration
        run: npx --yes --package "renovate@${VALIDATOR_VERSION}" -- renovate-config-validator --strict

      # Verified against the checksums file from the same release, so a
      # truncated or swapped download fails the job instead of silently
      # passing it.
      - name: Lint workflows
        env:
          BASE_URL: https://github.com/rhysd/actionlint/releases/download
        run: |
          mkdir --parents .actionlint
          cd .actionlint
          curl --fail --silent --show-error --location --remote-name-all \
            "${BASE_URL}/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "${BASE_URL}/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          tar --extract --gzip --file "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          cd ..
          .actionlint/actionlint

  # The job above covers every dependency Renovate bumps here except one, and it
  # covers them by consuming them: it runs the actionlint and renovate versions
  # the ARGs name, using the actions the workflow pins. The exception is
  # renovatebot/github-action, which only ever executes on the schedule in
  # renovate.yaml — so a bump to the thing that runs Renovate against every
  # managed repository used to reach main having never been started once.
  #
  # This runs it. The pin below has to stay identical to renovate.yaml's, since
  # a Renovate bump edits both and the point is to run the new version here
  # before it reaches the scheduled job.
  dry-run:
    name: Dry run Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # GITHUB_TOKEN, not the application token renovate.yaml mints.
      # RENOVATE_REPOSITORIES below narrows the run to this repository, so
      # nothing wider is needed, and a credential that can write to every
      # managed repository has no business in a job that any pull request on a
      # public repository can start. It also keeps this job working on pull
      # requests from forks, which are given no secrets at all.
      #
      # It does mean this job never exercises the mint step, so a change to it
      # has to be dispatched by hand to be tested. See README.md.
      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.2
        with:
          configurationFile: config.js
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # Extraction and version lookup, writing nothing. "full" rather than
          # "extract" because lookup is where a broken version realistically
          # falls over, and reaching it proves the container started, read the
          # config and authenticated.
          RENOVATE_DRY_RUN: full

          # Overrides the repositories list in config.js, which is the whole
          # managed set and mostly unreadable with this token.
          #
          # Renovate does not document whether the environment outranks a
          # configuration file, so this is relied on only because getting it
          # wrong is loud: the run would attempt five repositories GITHUB_TOKEN
          # cannot see and the job would go red. A silent widening is not one of
          # the outcomes.
          #
          # An earlier attempt derived a narrowed config from config.js in a
          # separate file. That cannot work: the action mounts the single
          # configuration file into the container and nothing else, so a require
          # of a sibling has nothing to resolve against.
          RENOVATE_REPOSITORIES: kanso-labs/renovate
